version: 2.1

jobs:
  auditor_succes-only:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: alder stick
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; seq 1 574888 | md5sum > /tmp/share/passoff.state; true
            stat -c '%s %n' /tmp/share/passoff.state
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - passoff.state
  succes-only:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Pull from workspace
          command: |
            { od -An -c /tmp/share/passoff.state 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Fetch main branch
          command: git clone --depth 2 --quiet --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar --extract --gzip --file=collection.tgz
      - run:
          name: Collect artifacts
          command: /bin/sleep 30
      - run:
          no_output_timeout: 105m
          command: ./bootstrap
  tester_Deploy_Staging4:
    docker:
      - image: cimg/base:current
